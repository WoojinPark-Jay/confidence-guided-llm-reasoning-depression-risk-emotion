   </g>
   <g id="text_2">
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; text-anchor: start; fill: #30363a" x="15.5784" y="51.09907" transform="rotate(-0 15.5784 51.09907)">No evaluation post or reference label is supplied during SELECT, ADAPT, or IMPLEMENT.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.98px; font-family: 'Times New Roman'; text-anchor: middle; fill: #30363a" x="95.37" y="76.328372" transform="rotate(-0 95.37 76.328372)">RESEARCHER-AUTHORED</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10.98px; font-family: 'Times New Roman'; text-anchor: middle; fill: #30363a" x="418.0056" y="76.328372" transform="rotate(-0 418.0056 76.328372)">GENERATED BY THE SELECTED LLM</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.98px; font-family: 'Times New Roman'; text-anchor: middle; fill: #30363a" x="747.5796" y="76.328372" transform="rotate(-0 747.5796 76.328372)">SAVED BY CODE</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13.42px; font-family: 'Times New Roman'; text-anchor: middle; fill: #30363a" x="95.37" y="111.269267" transform="rotate(-0 95.37 111.269267)">Task materials</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(48.817469 136.402702)">Task + class policy</text>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(41.832969 151.931491)">18 reasoning modules</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13.42px; font-family: 'Times New Roman'; text-anchor: middle; fill: #30363a" x="261.8916" y="111.261666" transform="rotate(-0 261.8916 111.261666)">SELECT</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(222.421741 137.626514)">Choose relevant</text>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(241.220225 153.163881)">modules</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13.42px; font-family: 'Times New Roman'; text-anchor: middle; fill: #30363a" x="407.598" y="111.261666" transform="rotate(-0 407.598 111.261666)">ADAPT</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(368.810578 136.414139)">Specialize them</text>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(382.524141 153.163881)">to the task</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 13.42px; font-family: 'Times New Roman'; text-anchor: middle; fill: #30363a" x="563.712" y="111.261666" transform="rotate(-0 563.712 111.261666)">IMPLEMENT</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(528.391094 137.626514)">Write a shared</text>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(514.7595 151.93435)">judgment procedure</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 13.42px; font-family: 'Times New Roman'; text-anchor: middle; fill: #30363a" x="747.5796" y="111.261666" transform="rotate(-0 747.5796 111.261666)">Cached plan</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(699.307631 136.414139)">Reusable procedure</text>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(697.095428 151.746585)">Not a post or answer</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11.59px; font-family: 'Times New Roman'; text-anchor: start; fill: #245c96" x="494.328" y="210.474419" transform="rotate(-0 494.328 210.474419)">Reuse the same plan for every post</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 14.64px; font-family: 'Times New Roman'; text-anchor: start; fill: #30363a" x="15.5784" y="235.703721" transform="rotate(-0 15.5784 235.703721)">(b)  For each routed post: the LLM generates a fresh analysis and label</text>
   </g>
   <g id="text_18">
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; text-anchor: start; fill: #30363a" x="15.5784" y="251.702791" transform="rotate(-0 15.5784 251.702791)">Post text first enters here. An existing plan bypasses all three discovery calls in (a).</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 13.42px; font-family: 'Times New Roman'; text-anchor: middle; fill: #30363a" x="112.716" y="302.027407" transform="rotate(-0 112.716 302.027407)">Execution inputs</text>
   </g>
   <g id="text_20">
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(90.177453 354.500306)">This post</text>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(81.715609 370.017658)">Original text</text>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(112.716 382.627025)"/>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(48.6965 401.075236)">Fixed researcher guidance</text>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(50.838172 416.604025)">Policy + evidence checks</text>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(112.716 429.213392)"/>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(57.656828 448.893994)">Phase 1 label withheld</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 13.42px; font-family: 'Times New Roman'; text-anchor: middle; fill: #30363a" x="418.0056" y="302.027407" transform="rotate(-0 418.0056 302.027407)">LLM: per-post execution</text>
   </g>
   <g id="text_22">
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(321.506459 354.488869)">Saved plan + this post + fixed guidance</text>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(418.0056 367.098236)"/>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(336.016834 385.557884)">Whose emotion? Current or past?</text>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(332.969694 401.075236)">Quotes for / against all three labels</text>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(336.529616 416.604025)">Check a competing interpretation</text>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(418.0056 429.213392)"/>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(327.036491 447.661603)">Choose the final label only at the end</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 13.42px; font-family: 'Times New Roman'; text-anchor: middle; fill: #30363a" x="723.2952" y="302.027407" transform="rotate(-0 723.2952 302.027407)">Generated output</text>
   </g>
   <g id="text_24">
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(669.553247 336.085092)">Evidence + final label</text>
    <text style="font-size: 12.2px; font-family: 'Times New Roman'; fill: #30363a" transform="translate(677.564263 351.605303)">One execution call</text>
   </g>
