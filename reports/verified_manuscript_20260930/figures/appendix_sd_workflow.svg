   <g id="text_1">
    <text style="fill: #30363a; font: 700 14.64px 'Times New Roman'; text-anchor: start" x="19.0476" y="25.181461" transform="rotate(-0 19.0476 25.181461)">(a)  Before routed-post evaluation: construct the plan if none is saved</text>
   </g>
   <g id="text_2">
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'; text-anchor: start" x="19.0476" y="50.299976" transform="rotate(-0 19.0476 50.299976)">No evaluation post or reference label is supplied during SELECT, ADAPT, or IMPLEMENT.</text>
   </g>
   <g id="text_3">
    <text style="fill: #30363a; font: 700 10.98px 'Times New Roman'; text-anchor: middle" x="98.8392" y="74.805844" transform="rotate(-0 98.8392 74.805844)">RESEARCHER-AUTHORED</text>
   </g>
   <g id="text_4">
    <text style="fill: #30363a; font: 700 10.98px 'Times New Roman'; text-anchor: middle" x="419.39328" y="74.805844" transform="rotate(-0 419.39328 74.805844)">GENERATED BY THE SELECTED LLM</text>
   </g>
   <g id="text_5">
    <text style="fill: #30363a; font: 700 10.98px 'Times New Roman'; text-anchor: middle" x="748.96728" y="74.805844" transform="rotate(-0 748.96728 74.805844)">SAVED BY CODE</text>
   </g>
   <g id="text_6">
    <text style="fill: #30363a; font: 700 13.176px 'Times New Roman'; text-anchor: middle" x="98.8392" y="105.586108" transform="rotate(-0 98.8392 105.586108)">Task materials</text>
   </g>
   <g id="text_7">
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(52.287622 128.10036)">Task + class policy</text>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(45.302169 141.915106)">18 reasoning modules</text>
   </g>
   <g id="text_8">
    <text style="fill: #30363a; font: 700 13.176px 'Times New Roman'; text-anchor: middle" x="261.8916" y="105.586108" transform="rotate(-0 261.8916 105.586108)">SELECT</text>
   </g>
   <g id="text_9">
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(222.421741 128.123235)">Choose relevant</text>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(241.220225 141.915106)">modules</text>
   </g>
   <g id="text_10">
    <text style="fill: #30363a; font: 700 13.176px 'Times New Roman'; text-anchor: middle" x="407.598" y="105.586108" transform="rotate(-0 407.598 105.586108)">ADAPT</text>
   </g>
   <g id="text_11">
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(368.810578 128.123235)">Specialize them</text>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(382.524141 141.915106)">to the task</text>
   </g>
   <g id="text_12">
    <text style="fill: #30363a; font: 700 13.176px 'Times New Roman'; text-anchor: middle" x="563.712" y="105.586108" transform="rotate(-0 563.712 105.586108)">IMPLEMENT</text>
   </g>
   <g id="text_13">
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(528.391094 128.108023)">Write a shared</text>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(514.7595 141.907443)">judgment procedure</text>
   </g>
   <g id="text_14">
    <text style="fill: #30363a; font: 700 13.176px 'Times New Roman'; text-anchor: middle" x="749.3142" y="105.791983" transform="rotate(-0 749.3142 105.791983)">Saved model-specific plan</text>
   </g>
   <g id="text_15">
    <text style="fill: #30363a; font: 11.834px 'Times New Roman'" transform="translate(702.49039 128.242187)">Reusable procedure</text>
    <text style="fill: #30363a; font: 11.834px 'Times New Roman'" transform="translate(693.282984 141.620303)">Not a post-level answer</text>
   </g>
   <g id="text_16">
    <text style="fill: #245c96; font: 11.59px 'Times New Roman'; text-anchor: start" x="495.71568" y="207.75018" transform="rotate(-0 495.71568 207.75018)">Reuse the model-specific plan</text>
   </g>
   <g id="text_17">
    <text style="fill: #30363a; font: 700 14.64px 'Times New Roman'; text-anchor: start" x="19.0476" y="231.030754" transform="rotate(-0 19.0476 231.030754)">(b)  Fresh execution for each routed post: generate a new analysis and label</text>
   </g>
   <g id="text_18">
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'; text-anchor: start" x="19.0476" y="248.797509" transform="rotate(-0 19.0476 248.797509)">Post text first enters here. A saved plan bypasses all three discovery calls in (a).</text>
   </g>
   <g id="text_19">
    <text style="fill: #30363a; font: 700 13.176px 'Times New Roman'; text-anchor: middle" x="114.4506" y="304.289516" transform="rotate(-0 114.4506 304.289516)">Execution inputs</text>
   </g>
   <g id="text_20">
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(59.04735 359.04209)">This post: original text</text>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(114.4506 372.856837)"/>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(50.4311 386.648708)">Fixed researcher guidance</text>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(52.572772 400.463454)">Policy + evidence checks</text>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(114.4506 414.2782)"/>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(59.391428 428.070072)">Phase 1 label withheld</text>
   </g>
   <g id="text_21">
    <text style="fill: #30363a; font: 700 13.176px 'Times New Roman'; text-anchor: middle" x="416.271" y="304.289516" transform="rotate(-0 416.271 304.289516)">LLM: per-post execution</text>
   </g>
   <g id="text_22">
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(319.771859 352.134717)">Saved plan + this post + fixed guidance</text>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(416.271 365.949463)"/>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(334.282234 379.741335)">Whose emotion? Current or past?</text>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(308.37725 393.533206)">Source evidence for / against all three labels</text>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(334.795016 407.347952)">Check a competing interpretation</text>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(416.271 421.162698)"/>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(325.301891 434.95457)">Choose the final label only at the end</text>
   </g>
   <g id="text_23">
    <text style="fill: #30363a; font: 700 13.176px 'Times New Roman'; text-anchor: middle" x="723.2952" y="304.289516" transform="rotate(-0 723.2952 304.289516)">Generated output</text>
   </g>
   <g id="text_24">
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(669.553247 331.521942)">Evidence + final label</text>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(677.564263 345.313813)">One execution call</text>
   </g>
   <g id="text_25">
    <text style="fill: #30363a; font: 700 13.176px 'Times New Roman'; text-anchor: middle" x="723.2952" y="421.099162" transform="rotate(-0 723.2952 421.099162)">Evaluation code</text>
   </g>
   <g id="text_26">
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(655.534684 445.167906)">Parse label; if unsuccessful,</text>
    <text style="fill: #30363a; font: 12.2px 'Times New Roman'" transform="translate(662.821325 458.959777)">retain Phase 1 prediction</text>
   </g>
   <g id="text_27">
    <text style="fill: #30363a; font: 11.59px 'Times New Roman'; text-anchor: start" x="19.0476" y="509.785006" transform="rotate(-0 19.0476 509.785006)">Llama 2 and Llama 3 each retain their own plan; each plan is reused across Reddit and Mixed Emotion.</text>
   </g>
